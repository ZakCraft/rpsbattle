name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Supabase credentials into a deploy copy
        run: |
          mkdir -p dist
          cp index.html style.css app.js dist/
          sed -i "s|__SUPABASE_URL__|${{ secrets.SUPABASE_RPS_URL }}|g" dist/app.js
          sed -i "s|__SUPABASE_ANON_KEY__|${{ secrets.SUPABASE_RPS_ANON_KEY }}|g" dist/app.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
